[package]
name = "cosmic_llm"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client for LLM APIs
reqwest = { version = "0.13", features = ["json", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Configuration
config = "0.15"
anyhow = "1.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }
cron = "0.16"

# UUIDs
uuid = { version = "1.0", features = ["v4", "serde"] }

# Async traits
async-trait = "0.1"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# WebSocket support for MCP
tokio-tungstenite = "0.29"
tungstenite = "0.29"

# Socket utilities for TCP keepalive configuration
socket2 = "0.6"

# Futures
futures = "0.3"

# Pin project for async
pin-project = "1.0"


# File operations
dirs = "6.0.0"

# Base64 encoding
base64 = "0.22.1"

# Document to markdown conversion
markdownify = "0.3.2"

# Hashing
sha2 = "0.11"

# Random
rand = "0.10"

# HTTP server for file attachments (async)
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
multer = "3.0"

# URL handling
url = "2.5.4"

# SQLite for storage
rusqlite = { version = "0.39", features = ["bundled", "chrono", "uuid", "load_extension"] }
# Vector search for long-term memory (sqlite-vec extension)
sqlite-vec = "0.1.6"
tokio-stream = "0.1"

# Token counting
tiktoken-rs = "0.9"

# MIME type detection for file uploads
mime_guess = "2.0"

# Async utilities for file streaming
tokio-util = { version = "0.7", features = ["codec", "io"] }

# Glob pattern matching for tools policy (enabled_mcp, enabled_tools, disabled_tools)
globset = "0.4"

# Agentic loop library (MCP support)
agentic-loop = { path = "agentic-loop" }

# MCP SDK (needed for type conversions)
rust-mcp-sdk = { version = "0.9", default-features = false, features = ["client", "stdio"] }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["openai", "anthropic"]
openai = []
anthropic = []

[workspace]
members = [".", "luna_thin_ui", "agentic-loop"]

# Unify iced with libcosmic's fork so iced_selection widgets compose in cosmic::Element.
[patch.crates-io]
iced = { git = "https://github.com/pop-os/libcosmic.git", branch = "master" }
iced_core = { git = "https://github.com/pop-os/libcosmic.git", branch = "master", package = "iced_core" }
iced_graphics = { git = "https://github.com/pop-os/libcosmic.git", branch = "master", package = "iced_graphics" }
iced_renderer = { git = "https://github.com/pop-os/libcosmic.git", branch = "master", package = "iced_renderer" }
iced_widget = { git = "https://github.com/pop-os/libcosmic.git", branch = "master", package = "iced_widget" }

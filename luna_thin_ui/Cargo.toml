[package]
name = "luna_thin_ui"
version = "0.1.0"
edition = "2021"
description = "Luna AI Thin Client - connects to Luna server via WebSocket"

[[bin]]
name = "luna-thin"
path = "src/main.rs"

[dependencies]
# COSMIC desktop framework. Pin to Cosmic Files' frosted-window revision.
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "8cb10bf6e24b86a7d2a9cf8c662d3e0154db1b21", default-features = false, features = ["multi-window", "tokio", "winit", "wayland", "about", "wgpu", "dbus-config", "rfd", "markdown", "highlighter"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream", "multipart", "native-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUIDs
uuid = { version = "1.0", features = ["v4", "serde"] }

# Async traits
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WebSocket client
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tungstenite = { version = "0.29", features = ["native-tls"] }

# Futures
futures = "0.3"
async-stream = "0.3"

# File operations
dirs = "6.0.0"

# Web browser
webbrowser = "1.0.5"

# License handling
license = "3.7.0"

# MIME type detection
mime_guess = "2.0"

# URL handling
url = "2.5.4"

# D-Bus support
zbus = "5.12.0"

# Audio support
rodio = "0.22"
rust-embed = "8.1"

# Clipboard support
arboard = "3.2"

# Markdown parsing for TTS
pulldown-cmark = "0.13"

# Base64 decoding for data: URI images
base64 = "0.22"

# Selectable text in message bubbles (vendored; patched for libcosmic iced ellipsize)
iced_selection = { path = "vendor/iced_selection", features = ["markdown", "cosmic"] }

[features]
default = ["ttsandstt"]
ttsandstt = []


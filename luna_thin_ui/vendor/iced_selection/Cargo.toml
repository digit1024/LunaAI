[package]
name = "iced_selection"
description = "Text selection for iced (vendored for libcosmic iced fork)"
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[features]
default = []
markdown = ["iced_widget/markdown"]
cosmic = ["dep:cosmic"]

[dependencies]
iced_widget = "0.14"
unicode-segmentation = "1.0"

[dependencies.cosmic]
package = "libcosmic"
git = "https://github.com/pop-os/libcosmic.git"
branch = "master"
default-features = false
features = ["winit", "wgpu", "markdown"]
optional = true

[lib]
name = "iced_selection"
path = "src/lib.rs"

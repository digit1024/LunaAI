name: luna_mobile
description: Luna AI companion for Android/iOS with websocket streaming chat.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  web_socket_channel: ^2.4.0
  flutter_markdown: ^0.6.18
  intl: ^0.19.0
  flutter_foreground_task: ^6.1.2
  flutter_local_notifications: ^17.1.2
  equatable: ^2.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 21
  image_path: assets/app_icon.png


name: luna_mobile
description: Luna AI companion for Android/iOS with websocket streaming chat.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.0.3
  audioplayers: ^6.5.1
  flutter_sound: ^9.30.0
  web_socket_channel: ^3.0.3
  flutter_markdown_plus: ^1.0.5
  intl: ^0.20.2
  flutter_foreground_task: ^9.1.0
  flutter_local_notifications: ^19.5.0
  equatable: ^2.0.5
  collection: ^1.18.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  wakelock_plus: ^1.2.1
  http: ^1.2.0
  file_picker: ^10.3.7
  wear: ^1.1.0
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/typing.mp3
    - assets/audio/done.mp3
    - assets/audio/sent.mp3
    - assets/audio/tool.mp3
    - assets/audio/buble.mp3
    - assets/luna_avatar.png

flutter_launcher_icons:
  android: true
  ios: true
  min_sdk_android: 21
  image_path: assets/app_icon.png


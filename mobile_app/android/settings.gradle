import java.util.Properties

pluginManagement {
    def localProperties = new Properties()
    def localPropertiesFile = new File(settingsDir, "local.properties")
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withReader("UTF-8") { reader ->
            localProperties.load(reader)
        }
    }

    def flutterSdkPath = localProperties.getProperty("flutter.sdk")
    if (flutterSdkPath == null) {
        throw new GradleException("flutter.sdk not set in local.properties")
    }

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.1.0" apply false
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
}

def localProperties = new Properties()
def localPropertiesFile = new File(rootDir, "local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterSdkPath = localProperties.getProperty("flutter.sdk")
if (flutterSdkPath == null) {
    throw new GradleException("flutter.sdk not set in local.properties")
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            url "${flutterSdkPath}/bin/cache/artifacts/engine/android"
        }
        maven {
            url "https://storage.googleapis.com/download.flutter.io"
        }
        maven {
            url "https://www.jitpack.io"
        }
    }
}

rootProject.name = "luna_mobile"
include(":app")
include(":wear")

// Fixes for the third-party `wear` package (from the pub cache):
//  - it pins compileSdk 31, which AGP 9 rejects against modern androidx deps;
//  - older templates relied on a namespace patch.
gradle.beforeProject { project ->
    if (project.name == "wear") {
        project.afterEvaluate {
            if (it.hasProperty("android")) {
                it.android {
                    namespace = "com.mjohnsullivan.flutterwear.wear"
                    compileSdkVersion 36
                }
            }
        }
    }
}

[package]
name = "agentic-loop"
version = "0.1.0"
edition = "2021"
description = "Agentic loop library for autonomous agent execution"

[lib]
name = "agentic_loop"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# Logging
tracing = "0.1"

# Futures
futures = "0.3"

# UUIDs
uuid = { version = "1.0", features = ["v4", "serde"] }

rust-mcp-sdk = { version = "0.8.1", default-features = false, features = ["client", "stdio"] }

[dev-dependencies]
tokio-test = "0.4"





# Cosmic LLM Configuration File
# This is a sample configuration file for Cosmic LLM
# Place this file at: ~/.local/share/cosmic_llm/config.toml
#
# Config shape: model_presets (identity + request params), tools_policies (MCP/tool allow/deny),
# profiles (reference a preset + policy + prompts). No backward compat with old profile fields.

# Default profile to use for new conversations
default = "openai"

# ── Model presets: backend, model, full endpoint URL, api_key, optional request params ──
# Endpoint = full URL we POST to (no path appended). Only include params you want sent (no defaults).

[model_presets.openai_gpt4o]
backend = "openai"
model = "gpt-4o"
endpoint = "https://api.openai.com/v1/chat/completions"
api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
max_tokens = 4000
temperature = 0.7

[model_presets.anthropic_claude]
backend = "anthropic"
model = "claude-3-5-sonnet-20241022"
endpoint = "https://api.anthropic.com/v1/messages"
api_key = "sk-ant-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
max_tokens = 4000
temperature = 0.7

[model_presets.ollama_local]
backend = "ollama"
model = "llama3.1:8b"
endpoint = "http://localhost:11434/v1/chat/completions"
api_key = ""
temperature = 0.7
max_tokens = 4000

[model_presets.gemini]
backend = "gemini"
model = "gemini-1.5-pro"
endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent"
api_key = "AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
max_tokens = 4000
temperature = 0.7

# ── Tools policies: glob patterns for enabled_mcp, enabled_tools, disabled_tools ──
# Empty enabled_mcp = no MCP servers in scope. Empty enabled_tools = no tools allowed.

[tools_policies.default]
enabled_mcp = ["filesystem", "weather", "mem*"]
enabled_tools = ["*"]
disabled_tools = []

[tools_policies.restricted]
enabled_mcp = ["filesystem"]
enabled_tools = ["read_file", "write_file", "list_dir", "schedule_task", "store_memory", "search_memory"]
disabled_tools = ["*_delete*"]

# ── Profiles: reference preset + policy + prompts (paths relative to config dir) ──

[profiles.openai]
model_preset = "openai_gpt4o"
prompts = ["profiles/openai.md"]
tools_policy = "default"
hidden = false

[profiles.anthropic]
model_preset = "anthropic_claude"
prompts = []
tools_policy = "default"
hidden = false

[profiles.ollama]
model_preset = "ollama_local"
prompts = []
tools_policy = "default"
hidden = false

[profiles.gemini]
model_preset = "gemini"
prompts = []
tools_policy = "default"
hidden = false

# Prompt configuration (global system prompt)
[prompts]
system_prompt_file = "~/.local/share/cosmic_llm/system_prompt.md"

# Title & Summary configuration
[title_summary]
title_generation_profile = "openai"
summary_chars = 1000
summary_loop_sleep_seconds = 15
title_generation_system_prompt = "Your task is to generate a conversation title that will describe the topic easily. Keep original conversation language and tone. YOU SHOULD ALWAYS ANSWER ONLY WITH TITLE. MAXIMUM 100CHARS. You will receive a part of the conversation transcript in next message"

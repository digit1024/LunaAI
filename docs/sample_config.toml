# Cosmic LLM Configuration File
# This is a sample configuration file for Cosmic LLM
# Place this file at: ~/.local/share/cosmic_llm/config.toml
#
# Config shape: model_presets (identity + request params), tools_policies (MCP/tool allow/deny),
# profiles (reference a preset + policy + prompts). No backward compat with old profile fields.

# Default profile to use for new conversations
default = "openai"

# ── Model presets: backend, model, full endpoint URL, api_key, optional request params ──
# Endpoint = full URL we POST to (no path appended). Only include params you want sent (no defaults).

[model_presets.openai_gpt4o]
backend = "openai"
model = "gpt-4o"
endpoint = "https://api.openai.com/v1/chat/completions"
api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
max_tokens = 4000
temperature = 0.7

# Reasoning models (o3, o4-mini, gpt-5.x): optional sampling + reasoning_effort.
# Omit any field to let the API use its own defaults (we do not send unset params).
[model_presets.openai_o3_high_reasoning]
backend = "openai"
model = "o3"
endpoint = "https://api.openai.com/v1/chat/completions"
api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
max_tokens = 16000
temperature = 1.0
top_p = 1.0
parallel_tool_calls = true
tool_choice = "auto"   # or "required", "none", or JSON object per OpenAI docs

[model_presets.openai_o3_high_reasoning.reasoning]
effort = "high"        # none | minimal | low | medium | high | xhigh (max on supported models)

[model_presets.anthropic_claude]
backend = "anthropic"
model = "claude-3-5-sonnet-20241022"
endpoint = "https://api.anthropic.com/v1/messages"
api_key = "sk-ant-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
max_tokens = 4000
temperature = 0.7

[model_presets.ollama_local]
backend = "ollama"
model = "llama3.1:8b"
endpoint = "http://localhost:11434/v1/chat/completions"
api_key = ""
temperature = 0.7
max_tokens = 4000

[model_presets.gemini]
backend = "gemini"
model = "gemini-1.5-pro"
endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent"
api_key = "AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
max_tokens = 4000
temperature = 0.7

# ── Tools policies: glob patterns for enabled_mcp, enabled_tools, disabled_tools ──
# Empty enabled_mcp = no MCP servers in scope. Empty enabled_tools = no tools allowed.

[tools_policies.default]
# Server ids must match mcp_config.json keys; empty = no MCP tools allowed
enabled_mcp = ["filesystem", "shell", "cosmic-llm-memory"]
enabled_tools = ["*"]
disabled_tools = []

[tools_policies.restricted]
enabled_mcp = ["filesystem"]
enabled_tools = ["read_file", "write_file", "list_dir", "schedule_task", "store_memory", "search_memory"]
disabled_tools = ["*_delete*"]

# ── Profiles: reference preset + policy + prompts (paths relative to config dir) ──

[profiles.openai]
model_preset = "openai_gpt4o"
prompts = ["profiles/openai.md"]
tools_policy = "default"
hidden = false

[profiles.anthropic]
model_preset = "anthropic_claude"
prompts = []
tools_policy = "default"
hidden = false

[profiles.ollama]
model_preset = "ollama_local"
prompts = []
tools_policy = "default"
hidden = false

[profiles.gemini]
model_preset = "gemini"
prompts = []
tools_policy = "default"
hidden = false

# ── Embedding config (for long-term memory vector search) ──
# When enabled, memory recall uses semantic search via sqlite-vec instead of keyword search.
# Requires OpenAI-compatible embeddings API. Set api_key or use OPENAI_API_KEY env.

[embedding]
enabled = false
endpoint = "https://api.openai.com/v1/embeddings"
model = "text-embedding-3-small"
dimensions = 1536
api_key = ""  # optional, falls back to OPENAI_API_KEY

# Memory retrieval control (only used when embedding is enabled)
max_memories = 3           # Maximum memories to return per query (default: 3)
# max_distance = 0.4       # Maximum cosine distance (0.0-2.0, lower = more similar). Comment out for no filter.
# min_importance = 2       # Minimum importance score (1-5). Comment out for no filter.

# ── Deep sleep: background memory maintenance ──
# Three LLM steps: summarize → evaluate (KEEP/UPDATE/DELETE) → extract new memories.
# Full default prompt text: quick_setup/docs/MEMORY.md#deep-sleep-deep_sleep
[deep_sleep]
enabled = false
# profile = "openai"       # LLM profile for summarize / evaluate / extract (required when enabled)
# interval_hours = 24
# memory_batch_size = 20   # step-2 batch size; 184+ memories in one call needs ~9k+ max_tokens output
# max_conversations_per_run = 50
# inter_call_delay_secs = 2
# summarize_prompt = "..."  # step 1 system prompt (built-in default if omitted)
# evaluate_prompt = "..."   # step 2 system prompt
# extract_prompt = "..."    # step 3 system prompt

# Prompt configuration (global system prompt)
[prompts]
system_prompt_file = "~/.local/share/cosmic_llm/system_prompt.md"

# Title & Summary configuration
[title_summary]
title_generation_profile = "openai"
summary_chars = 1000
summary_loop_sleep_seconds = 15
title_generation_system_prompt = "Your task is to generate a conversation title that will describe the topic easily. Keep original conversation language and tone. YOU SHOULD ALWAYS ANSWER ONLY WITH TITLE. MAXIMUM 100CHARS. You will receive a part of the conversation transcript in next message"

# Conversation compaction configuration (manual compact + auto compact on context threshold)
[conversation_compact]
# system_prompt = "..."      # compaction system prompt (built-in default if omitted)
# max_tokens = 4000          # max output tokens for compaction summary

# Cosmic LLM Configuration File
# This is a sample configuration file for Cosmic LLM
# Place this file at: ~/.local/share/cosmic_llm/config.toml

# Default profile to use for new conversations
default = "openai"

# LLM Profiles configuration
[profiles]

# OpenAI profile
[profiles.openai]
backend = "openai"
api_key = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"  # Replace with your OpenAI API key
model = "gpt-4o"
endpoint = "https://api.openai.com/v1"
temperature = 0.7
max_tokens = 4000
# Relative paths resolve from ~/.local/share/cosmic_llm/
profile_prompt_file = "profiles/openai.md"
# Comma-separated list or array is accepted
enabled_mcp = "filesystem,weather"

# Anthropic profile
[profiles.anthropic]
backend = "anthropic"
api_key = "sk-ant-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"  # Replace with your Anthropic API key
model = "claude-3-5-sonnet-20241022"
endpoint = "https://api.anthropic.com"
temperature = 0.7
max_tokens = 4000

# Ollama profile (local models)
[profiles.ollama]
backend = "ollama"
api_key = ""  # Not needed for Ollama
model = "llama3.1:8b"
endpoint = "http://localhost:11434"
temperature = 0.7
max_tokens = 4000
# Hide this profile from dropdowns (still accessible via config)
hidden = false

# Google Gemini profile
[profiles.gemini]
backend = "gemini"
api_key = "AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"  # Replace with your Google AI API key
model = "gemini-1.5-pro"
endpoint = "https://generativelanguage.googleapis.com"
temperature = 0.7
max_tokens = 4000

# Prompt configuration
[prompts]
system_prompt_file = "~/.local/share/cosmic_llm/system_prompt.md"

# Title & Summary configuration
# Note: Title generation only runs if title_generation_profile is specified
[title_summary]
# Required: Profile name to use for title generation (feature disabled if not specified)
title_generation_profile = "openai"

# Maximum characters to include in conversation transcript for title generation
summary_chars = 1000

# Sleep interval in seconds for background title generation thread (server mode only)
summary_loop_sleep_seconds = 15

# System prompt for title generation
title_generation_system_prompt = "Your task is to generate a conversation title that will describe the topic easily. Keep original conversation language and tone. YOU SHOULD ALWAYS ANSWER ONLY WITH TITLE. MAXIMUM 100CHARS. You will receive a part of the conversation transcript in next message"

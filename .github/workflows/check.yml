name: Check & Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.94"   # pinned: deterministic lints (latest stable drifts)
          components: clippy
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev libinput-dev libgbm-dev libdrm-dev libseat-dev libasound2-dev libssl-dev pkg-config
      - name: cargo check
        run: unset ARGV0 && cargo check --workspace
      - name: cargo clippy
        run: unset ARGV0 && cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (server crates)
        run: unset ARGV0 && cargo test -p cosmic_llm -p agentic-loop
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: unset ARGV0 && cargo audit

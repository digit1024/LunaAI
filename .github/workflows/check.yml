name: Check & Audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo check
        run: unset ARGV0 && cargo check --workspace
      - name: cargo clippy
        run: unset ARGV0 && cargo clippy --workspace --all-targets -- -D warnings
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: unset ARGV0 && cargo audit
